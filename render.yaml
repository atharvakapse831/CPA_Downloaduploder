services:
  - type: web
    name: cpa-media-service
    env: node
    region: oregon
    plan: starter

    buildCommand: |
      npm install
      pip install yt-dlp

    # ✅ FIX: start BOTH the HTTP server and the BullMQ worker in one process.
    # Without this, jobs are queued but nothing ever picks them up.
    startCommand: node src/server.js & node src/queue/worker.js & wait

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CPA_SERVICE_KEY
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 30
      - key: YTDLP_TIMEOUT_MS
        value: 30000
      - key: YTDLP_DOWNLOAD_TIMEOUT_MS
        value: 120000
      - key: CACHE_TTL_METADATA
        value: 21600
      - key: CACHE_TTL_THUMBNAIL
        value: 86400

      # ✅ NEW: AWS credentials for S3 upload in worker.js
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: S3_BUCKET
        value: cpacontentstream
